trial.j1.subject=Bienvenue sur MedSol : vos 3 premiers réglages
trial.j1.body=Bonjour {0},\n\nBienvenue sur MedSol ! Pour bien démarrer, trois réglages de 5 minutes :\n\n1. Paramètres › Cabinet : votre INPE, votre n° d’Ordre et votre ville, imprimés sur vos ordonnances.\n2. Paramètres › Horaires : vos jours et heures de consultation, pour l’agenda et la prise de rendez-vous en ligne.\n3. Paramètres › Utilisateurs : invitez votre assistante, elle recevra son accès par e-mail.\n\nVotre espace : {1}\n\nUne question, une démonstration ? {2}\n\nL’équipe MedSol
trial.j3.subject=MedSol : une ordonnance en 30 secondes
trial.j3.body=Bonjour {0},\n\nTrois astuces pour vos ordonnances :\n\n• Tapez le début du nom ou le composant (« amlo 5 », « paracetamol ») : MedSol propose le médicament et vous alerte en cas d’allergie ou d’interaction.\n• Enregistrez vos ordonnances habituelles comme « ordonnances types » et appliquez-les en un clic.\n• Vos ordonnanciers préimprimés : dans Paramètres › Impression, réglez la police, les tailles et la position de la date et du nom du patient ; l’« aperçu avec grille » vous aide à tomber pile dans les cases.\n\n{1}\n\nBesoin d’aide pour le réglage ? {2}\n\nL’équipe MedSol
trial.j7.subject=MedSol : moins de rendez-vous manqués
trial.j7.body=Bonjour {0},\n\nDeux réglages qui font gagner du temps à votre secrétariat :\n\n• Paramètres › Réservation en ligne : vos patients demandent un rendez-vous depuis votre page ou un QR code affiché au cabinet ; vous validez chaque demande.\n• Paramètres › Rappels : un e-mail de rappel part automatiquement la veille de chaque rendez-vous.\n\nVous appréciez MedSol ? Partagez votre lien de parrainage avec un confrère : 1 mois offert pour vous et pour lui.\n{3}\n\n{1}\n\nL’équipe MedSol
