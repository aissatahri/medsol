home.faq.title=Questions fréquentes
home.faq.1.q=Faut-il installer un logiciel ?
home.faq.1.a=Non. MedSol fonctionne dans le navigateur, sur ordinateur, tablette et téléphone. Vous pouvez aussi l’ajouter à l’écran d’accueil comme une application.
home.faq.2.q=Les données de mes patients sont-elles en sécurité ?
home.faq.2.a=Oui : connexion chiffrée, double authentification, données cloisonnées par cabinet, sauvegardes chiffrées chaque jour hors du serveur, hébergement dans l’Union européenne. Personne d’autre que votre cabinet n’accède aux dossiers.
home.faq.3.q=Puis-je garder mes ordonnanciers préimprimés ?
home.faq.3.a=Oui, c’est même le réglage par défaut : MedSol laisse vides l’en-tête et le pied de page. Dans Paramètres › Impression, vous réglez la police, les tailles et la position exacte de la date, du nom du patient ou du titre pour tomber dans les cases de vos feuilles, avec un aperçu et une grille de calage. Vous pouvez aussi faire imprimer par MedSol un en-tête complet (INPE, n° d’Ordre, adresse).
home.faq.4.q=Que se passe-t-il à la fin de l’essai ?
home.faq.4.a=Vous choisissez de vous abonner. Sinon, votre cabinet passe en lecture seule : rien n’est effacé, vos données restent consultables et exportables.
home.faq.5.q=Comment se fait le paiement ?
home.faq.5.a=Par virement ou versement, au mois ou à l’année. Une facture est fournie pour chaque paiement.
home.faq.6.q=Mon assistante peut-elle l’utiliser ?
home.faq.6.a=Oui. Elle a son propre compte : accueil, salle d’attente, rendez-vous et, si vous l’autorisez, caisse et résultats. Les dossiers médicaux restent réservés au médecin.
home.final.title=Prêt à simplifier votre cabinet ?
home.final.text=Créez votre cabinet en deux minutes et essayez MedSol gratuitement pendant 30 jours.

