trial.j1.subject=Welcome to MedSol: your first 3 settings
trial.j1.body=Hello {0},\n\nWelcome to MedSol! Three 5-minute settings to get started:\n\n1. Settings › Practice: your professional IDs and city, printed on your prescriptions.\n2. Settings › Hours: your consultation days and times, for the calendar and online booking.\n3. Settings › Users: invite your assistant, who will receive access by e-mail.\n\nYour workspace: {1}\n\nA question or a demo? {2}\n\nThe MedSol team
trial.j3.subject=MedSol: a prescription in 30 seconds
trial.j3.body=Hello {0},\n\nThree tips for your prescriptions:\n\n• Type the start of the name or the substance: MedSol suggests the medicine and warns you of allergies or interactions.\n• Save your usual prescriptions as templates and apply them in one click.\n• Pre-printed pads: in Settings › Printing, adjust the font, sizes and position of the date and patient name; the “preview with grid” helps you hit the boxes.\n\n{1}\n\nNeed help with the settings? {2}\n\nThe MedSol team
trial.j7.subject=MedSol: fewer missed appointments
trial.j7.body=Hello {0},\n\nTwo settings that save your front desk time:\n\n• Settings › Online booking: patients request an appointment from your page or a QR code at the practice; you approve each request.\n• Settings › Reminders: an e-mail reminder goes out automatically the day before each appointment.\n\nEnjoying MedSol? Share your referral link with a colleague: 1 free month for you both.\n{3}\n\n{1}\n\nThe MedSol team
