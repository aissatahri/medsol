# faq7
home.faq.7.q=Can I delete a patient record?
home.faq.7.a=Medical records must be kept, so MedSol offers archiving. The record (duplicate, deceased or departed patient) leaves the lists and search without losing anything, and the doctor can restore it at any time from “Archived records”.

