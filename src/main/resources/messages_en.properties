home.faq.title=Frequently asked questions
home.faq.1.q=Do I need to install anything?
home.faq.1.a=No. MedSol runs in the browser on computer, tablet and phone. You can also add it to your home screen like an app.
home.faq.2.q=Is my patients’ data safe?
home.faq.2.a=Yes: encrypted connection, two-factor authentication, data isolated per practice, encrypted off-site backups every day, hosting in the European Union. Only your practice can access the records.
home.faq.3.q=Can I keep my pre-printed prescription pads?
home.faq.3.a=Yes. A “letterhead” option leaves room for your header; otherwise MedSol prints a full header with your details.
home.faq.4.q=What happens at the end of the trial?
home.faq.4.a=You choose whether to subscribe. Otherwise your practice becomes read-only: nothing is deleted, your data remains viewable and exportable.
home.faq.5.q=How do I pay?
home.faq.5.a=By bank transfer, monthly or yearly. An invoice is provided for every payment.
home.faq.6.q=Can my assistant use it?
home.faq.6.a=Yes. She has her own account: reception, waiting room, appointments and, if you allow it, cash desk and results. Medical records remain reserved to the doctor.
home.final.title=Ready to simplify your practice?
home.final.text=Create your practice in two minutes and try MedSol free for 30 days.

