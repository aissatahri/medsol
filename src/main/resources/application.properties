spring.application.name=medsol

# Base medsol_db. Un seul utilisateur de connexion : l'application fait SET ROLE medsol_app (voir TenantDataSource).
medsol.db.url=${MEDSOL_DB_URL:jdbc:postgresql://localhost:5432/medsol_db}
medsol.db.user=${MEDSOL_DB_USER:postgres}
medsol.db.password=${MEDSOL_DB_PASSWORD:}

# Flyway se connecte lui-même (propriétaire du schéma, sans SET ROLE)
spring.flyway.url=${medsol.db.url}
spring.flyway.user=${medsol.db.user}
spring.flyway.password=${medsol.db.password}

spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Le français est le fichier par défaut (messages.properties, sans « _fr ») : sans ce réglage, une page demandée en
# français prendrait la langue du système du serveur (anglais sur Ubuntu) avant le fichier par défaut.
spring.messages.fallback-to-system-locale=false
spring.thymeleaf.cache=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.compression.enabled=true
server.forward-headers-strategy=framework

# Données de démonstration (trois cabinets fictifs) : développement uniquement
medsol.demo=${MEDSOL_DEMO:false}

medsol.security.max-failed-logins=5
medsol.security.lock-minutes=15

# SaaS : administrateurs de la plateforme (e-mails séparés par des virgules), paiement de l'abonnement
medsol.platform-admins=${MEDSOL_PLATFORM_ADMINS:}
medsol.stripe.secret-key=${MEDSOL_STRIPE_SECRET_KEY:}
medsol.stripe.webhook-secret=${MEDSOL_STRIPE_WEBHOOK_SECRET:}
medsol.billing.manual-instructions=${MEDSOL_BILLING_INSTRUCTIONS:}
# Fichiers joints : 10 Mo au plus
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# E-mails (mot de passe oublié, invitations) : SMTP. Sans MEDSOL_MAIL_HOST, le message est écrit dans le journal.
spring.mail.host=${MEDSOL_MAIL_HOST:}
spring.mail.port=${MEDSOL_MAIL_PORT:587}
spring.mail.username=${MEDSOL_MAIL_USER:}
spring.mail.password=${MEDSOL_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MEDSOL_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
medsol.mail.from=${MEDSOL_MAIL_FROM:no-reply@medsol.app}
# Adresse publique du site, pour les liens envoyés par e-mail (obligatoire en production)
medsol.base-url=${MEDSOL_BASE_URL:}
# Double authentification obligatoire pour les médecins (sinon recommandée)
medsol.security.require-2fa-doctors=${MEDSOL_REQUIRE_2FA_DOCTORS:false}

# Clé de chiffrement des secrets en base (32 octets en base64 : openssl rand -base64 32). Obligatoire ; à sauvegarder
# hors du serveur : sans elle, les doubles authentifications devront être réactivées.
medsol.encryption-key=${MEDSOL_ENCRYPTION_KEY:}
# SMS (rappels automatiques de rendez-vous) : prestataire Twilio ; sans ces valeurs, l'option SMS reste désactivée
medsol.sms.twilio-sid=${MEDSOL_SMS_TWILIO_SID:}
medsol.sms.twilio-token=${MEDSOL_SMS_TWILIO_TOKEN:}
medsol.sms.from=${MEDSOL_SMS_FROM:}
# Tâches planifiées (rappels) : désactivables (tests)
medsol.taches=${MEDSOL_TACHES:true}
# Serveur de test : bandeau « données fictives » (MEDSOL_ENVIRONNEMENT=test) et lien vers la production
medsol.environnement=${MEDSOL_ENVIRONNEMENT:}
medsol.url-production=${MEDSOL_URL_PRODUCTION:}
