<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1730">
  <title th:text="#{forgot.title} + ' - MedSol'">Mot de passe oublié - MedSol</title>
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png(v=2)}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<!-- Mot de passe oublié : un lien à usage unique, valable 30 minutes, est envoyé à l'adresse du compte -->
<body class="page-connexion">
<div th:replace="~{fragments/public :: bandeau-test}"></div>
  <aside th:replace="~{fragments/public :: vitrine}"></aside>
  <main class="connexion-panneau">
    <div class="connexion-boite">
      <h1 th:text="#{forgot.title}">Mot de passe oublié</h1>
      <p class="sous-titre" th:text="#{forgot.subtitle}">Saisissez l'adresse e-mail de votre compte : vous recevrez un lien pour choisir un nouveau mot de passe.</p>
      <p class="alerte erreur" th:if="${param.trop}" role="alert" th:text="#{limit.blocked}">Trop de tentatives.</p>
      <p class="alerte succes" th:if="${param.envoye}" role="status" th:text="#{forgot.sent}">Si un compte existe, un e-mail a été envoyé.</p>
      <form th:action="@{/mot-de-passe-oublie}" method="post" class="formulaire" th:unless="${param.envoye}">
        <label><span th:text="#{login.email}">E-mail</span>
          <input type="email" name="email" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="200" autofocus></label>
        <button type="submit" class="bouton principal large" th:text="#{forgot.submit}">Recevoir le lien</button>
      </form>
      <p class="connexion-note"><a th:href="@{/login}" th:text="#{forgot.back}">Retour à la connexion</a></p>
      <p th:replace="~{fragments/public :: langues}"></p>
    </div>
  </main>
</body>
</html>
