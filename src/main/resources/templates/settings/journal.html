<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'settings')}">
<head><title th:text="#{settings.journal} + ' - MedSol'">Journal des accès - MedSol</title></head>
<body>
<!-- Journal des accès repris de SGCM-Cardio Web (les codes d'action restent tels quels : ils servent à la recherche) -->
<main id="main" class="contenu">
  <header class="entete-page">
    <div>
      <h1 th:text="#{settings.journal}">Journal des accès</h1>
      <p class="sous-titre" th:text="#{log.subtitle}">Connexions, dossiers et documents ouverts, modifications.</p>
    </div>
  </header>
  <div class="parametres">
    <nav th:replace="~{settings/navigation :: navigation('journal')}"></nav>
    <div class="parametres-section">

  <div class="carte">
    <form class="filtres-consultations" th:hx-get="@{/settings/journal}" hx-target="#entrees-journal" hx-swap="outerHTML"
          hx-trigger="change, input changed delay:300ms from:input[name=q]">
      <label><th:block th:text="#{stats.month}">Mois</th:block> <input type="month" name="mois" th:value="${mois}"></label>
      <input type="hidden" name="u" th:if="${u != null}" th:value="${u}">
      <label><th:block th:text="#{log.search}">Rechercher</th:block> <input type="search" name="q" th:value="${q}" th:placeholder="#{log.search.example}" autocomplete="off"></label>
    </form>
    <p class="filtre-actif" th:if="${u != null}"><th:block th:text="#{log.historyOf}">Historique de</th:block> <strong th:text="${compte}">Nadia</strong>
      <a class="bouton petit" th:href="@{/settings/journal(mois=${mois})}" th:title="#{log.allAccounts.help}" th:text="#{log.allAccounts}">× Tous les comptes</a></p>
    <div id="entrees-journal" th:fragment="entrees">
      <p class="vide" th:if="${#lists.isEmpty(entrees)}" th:text="#{log.none}">Aucune entrée.</p>
      <table class="tableau compact" th:unless="${#lists.isEmpty(entrees)}">
        <thead><tr><th th:text="#{appointment.date}">Date</th><th th:text="#{log.user}">Utilisateur</th><th th:text="#{log.action}">Action</th><th th:text="#{log.object}">Objet</th><th class="masque-mobile" th:text="#{log.address}">Adresse</th></tr></thead>
        <tbody>
          <tr th:each="e : ${entrees}" th:classappend="${#strings.contains(e.action, 'ECHEC')} ? 'ligne-refus'">
            <td class="heure" th:text="${#temporals.format(e.quand.atZone(cab.zone), 'dd/MM/yyyy HH:mm:ss')}">date</td>
            <td th:text="${e.utilisateur} + (${e.role != '-'} ? ' (' + #{'users.role.' + ${e.role}} + ')' : '')">assistante</td>
            <td th:text="${e.action}">LECTURE</td>
            <td class="ressource" th:text="${e.objet} + (${e.objetId != null} ? ' ' + ${e.objetId} : '')">patient</td>
            <td class="masque-mobile" th:text="${e.ip}">127.0.0.1</td>
          </tr>
        </tbody>
      </table>
      <p class="note" th:if="${#lists.size(entrees) == limite}" th:text="#{log.limit}">Les 500 entrées les plus récentes sont affichées.</p>
    </div>
  </div>
    </div>
  </div>
</main>
</body>
</html>
