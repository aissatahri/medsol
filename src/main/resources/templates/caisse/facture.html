<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'caisse')}">
<head><title th:text="#{pat.invoice} + ' - MedSol'">Facture - MedSol</title></head>
<body>
<!-- Formulaire de facture repris de SGCM-Cardio Web -->
<main id="main" class="contenu">
  <header class="entete-page">
    <div>
      <a class="retour" th:href="@{/patients/{id}(id=${patient.id})}" th:text="'‹ ' + ${patient.nomComplet()}">‹ Patient</a>
      <h1 th:text="#{pat.invoice}">Facture</h1>
      <p class="sous-titre" th:text="#{cash.invoice.help}">Cochez les actes réalisés, ajustez le montant si besoin.</p>
    </div>
  </header>

  <form class="carte" method="post" target="_blank" th:action="@{/patients/{id}/facture(id=${patient.id})}">
    <label class="date-facture"><th:block th:text="#{cash.invoice.date}">Date de la facture</th:block> <input type="date" name="date" required th:value="${date}"></label>
    <p class="vide" th:if="${#lists.isEmpty(choix)}" th:text="#{cash.acts.none}">Aucun acte dans le catalogue.</p>
    <table class="tableau facture-actes" th:unless="${#lists.isEmpty(choix)}">
      <thead><tr><th></th><th th:text="#{actes.name}">Acte</th><th th:text="#{dos.pay.amount} + ' (' + ${@monnaie.symbole(devise)} + ')'">Montant</th></tr></thead>
      <tbody>
        <tr th:each="c : ${choix}">
          <td><input type="checkbox" th:name="'acte_' + ${c.acteId}" value="1" th:checked="${c.coche}" th:attr="aria-label=#{cash.invoice.bill(${c.nom})}"></td>
          <td th:text="${c.nom}">Consultation</td>
          <td><input type="text" inputmode="decimal" th:name="'prix_' + ${c.acteId}" th:value="${@monnaie.saisie(c.prix)}" th:attr="aria-label=#{dos.pay.amount}"></td>
        </tr>
      </tbody>
    </table>
    <div class="actions-formulaire">
      <button type="submit" class="bouton principal" th:text="#{cash.invoice.print}">Imprimer la facture (PDF)</button>
    </div>
  </form>
</main>
</body>
</html>
