trial.j1.body=Hola {0}:\n\n¡Bienvenido a MedSol! Tres ajustes de 5 minutos para empezar:\n\n1. Ajustes › Consultorio: sus identificadores profesionales y su ciudad, impresos en sus recetas.\n2. Ajustes › Horarios: sus días y horas de consulta, para la agenda y las citas en línea.\n3. Ajustes › Usuarios: invite a su asistente, recibirá su acceso por correo.\n\nSu espacio: {1}\n\n¿Una pregunta o una demostración? {2}\n\nEl equipo de MedSol
trial.j3.subject=MedSol: una receta en 30 segundos
trial.j3.body=Hola {0}:\n\nTres consejos para sus recetas:\n\n• Escriba el inicio del nombre o la sustancia: MedSol propone el medicamento y le avisa de alergias o interacciones.\n• Guarde sus recetas habituales como plantillas y aplíquelas con un clic.\n• Recetarios preimpresos: en Ajustes › Impresión, ajuste la fuente, los tamaños y la posición de la fecha y del nombre; la «vista previa con cuadrícula» le ayuda a acertar.\n\n{1}\n\n¿Necesita ayuda? {2}\n\nEl equipo de MedSol
trial.j7.subject=MedSol: menos citas perdidas
trial.j7.body=Hola {0}:\n\nDos ajustes que ahorran tiempo a su secretaría:\n\n• Ajustes › Citas en línea: sus pacientes piden cita desde su página o un código QR en el consultorio; usted valida cada solicitud.\n• Ajustes › Recordatorios: un correo de recordatorio sale automáticamente la víspera de cada cita.\n\n¿Le gusta MedSol? Comparta su enlace de recomendación con un colega: 1 mes gratis para los dos.\n{3}\n\n{1}\n\nEl equipo de MedSol
