home.faq.title=Preguntas frecuentes
home.faq.1.q=¿Hay que instalar algo?
home.faq.1.a=No. MedSol funciona en el navegador, en ordenador, tableta y teléfono. También puede añadirlo a la pantalla de inicio como una aplicación.
home.faq.2.q=¿Están seguros los datos de mis pacientes?
home.faq.2.a=Sí: conexión cifrada, doble autenticación, datos aislados por consultorio, copias cifradas diarias fuera del servidor, alojamiento en la Unión Europea. Solo su consultorio accede a las historias.
home.faq.3.q=¿Puedo seguir usando mis recetarios preimpresos?
home.faq.3.a=Sí. La opción «papel con membrete» deja el espacio de su encabezado; si no, MedSol imprime un encabezado completo con sus datos.
home.faq.4.q=¿Qué pasa al final de la prueba?
home.faq.4.a=Usted decide si se suscribe. Si no, su consultorio pasa a solo lectura: no se borra nada y sus datos siguen consultables y exportables.
home.faq.5.q=¿Cómo se paga?
home.faq.5.a=Por transferencia, mensual o anual. Se emite una factura por cada pago.
home.faq.6.q=¿Puede usarlo mi asistente?
home.faq.6.a=Sí. Tiene su propia cuenta: recepción, sala de espera, citas y, si usted lo autoriza, caja y resultados. Las historias clínicas quedan reservadas al médico.
home.final.title=¿Listo para simplificar su consultorio?
home.final.text=Cree su consultorio en dos minutos y pruebe MedSol gratis durante 30 días.

